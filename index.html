<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pizza Khan — Меню</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --black:#14120F; --paper:#fff; --line:#EBE7DE; --bronze:#B8892B; --bronze-dim:#8C6A22; --gray:#6B6560; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--paper);color:var(--black);font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}

  /* Header */
  .kh{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);text-align:center;padding:12px 16px 10px;}
  .kh-back{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--bronze);background:none;border:none;cursor:pointer;padding:0;margin-bottom:8px;}
  .kh-logo{font-size:20px;font-weight:900;letter-spacing:1px;}
  .kh-logo span{color:var(--bronze);}
  .kh-sub{font-size:10px;letter-spacing:2.5px;color:var(--bronze-dim);font-weight:600;margin-top:2px;}
  .kh-pills{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px;}
  .kh-pill{font-size:11px;color:var(--gray);border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:#faf9f6;}

  /* Category grid */
  #home{padding:14px 12px 32px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .card{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:4/3;cursor:pointer;background:#e8e4dc;box-shadow:0 2px 8px rgba(0,0,0,.08);-webkit-tap-highlight-color:transparent;}
  .card:active{opacity:.85;}
  .card img{width:100%;height:100%;object-fit:cover;display:block;}
  .card-ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.65) 0%,rgba(0,0,0,.1) 60%,transparent 100%);}
  .card-lbl{position:absolute;bottom:0;left:0;right:0;padding:10px 12px;font-size:14px;font-weight:800;color:#fff;letter-spacing:.5px;text-shadow:0 1px 4px rgba(0,0,0,.5);}

  /* Ecwid wrap */
  #store{display:none;padding:0 0 40px;}

  /* Payment overlay */
  .pay{display:none;position:fixed;inset:0;z-index:100;background:#fff;overflow-y:auto;}
  .pay.on{display:block;}
  .pay-inner{max-width:400px;margin:0 auto;padding:48px 24px;text-align:center;}
  .pay-icon{width:52px;height:52px;margin:0 auto 16px;}
  .pay-title{font-size:22px;font-weight:900;margin-bottom:6px;}
  .pay-sub{font-size:13px;color:var(--gray);line-height:1.6;margin-bottom:28px;}
  .pay-card{border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:20px;}
  .pay-amt{font-size:34px;font-weight:900;margin-bottom:4px;}
  .pay-no{font-size:12px;color:var(--bronze-dim);font-weight:700;margin-bottom:20px;}
  .pay-qr{width:180px;height:180px;border:1px solid var(--line);border-radius:12px;padding:8px;margin:0 auto 16px;display:block;}
  .pay-btn{display:inline-block;background:var(--black);color:#fff!important;text-decoration:none;font-weight:700;font-size:15px;padding:14px 28px;border-radius:12px;}
  .pay-note{font-size:11px;color:var(--gray);margin-top:12px;line-height:1.5;}
  .pay-cash{font-size:15px;line-height:1.7;}
  .pay-close{margin-top:28px;background:none;border:none;color:var(--bronze-dim);font-size:13px;font-weight:600;text-decoration:underline;cursor:pointer;padding:8px;}
</style>
</head>
<body>

<!-- Payment overlay -->
<div class="pay" id="pay">
  <div class="pay-inner">
    <svg class="pay-icon" viewBox="0 0 52 52" fill="none">
      <circle cx="26" cy="26" r="24" stroke="#B8892B" stroke-width="1.5"/>
      <path d="M16 26.5L22 32.5L36 18.5" stroke="#B8892B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <p class="pay-title">Заказ принят!</p>
    <p class="pay-sub">Уже передали на кухню.<br>Осталось оплатить.</p>
    <div id="payKaspi" class="pay-card" style="display:none">
      <p class="pay-amt" id="payAmt">—</p>
      <p class="pay-no" id="payNo">ЗАКАЗ №—</p>
      <img class="pay-qr" id="payQr" alt="QR">
      <a class="pay-btn" id="payLink" href="#" target="_blank" rel="noopener">Открыть Kaspi Pay</a>
      <p class="pay-note">Наведите камеру на QR или нажмите кнопку</p>
    </div>
    <div id="payCash" class="pay-card" style="display:none">
      <p class="pay-no" id="payCashNo">ЗАКАЗ №—</p>
      <p class="pay-cash">Оплата наличными.<br>Сумма: <b id="payCashAmt">—</b></p>
    </div>
    <button class="pay-close" onclick="document.getElementById('pay').classList.remove('on')">Вернуться в меню</button>
  </div>
</div>

<!-- Header -->
<header class="kh">
  <button class="kh-back" id="backBtn" onclick="showHome()">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 12L6 8L10 4" stroke="#B8892B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Вернуться в меню
  </button>
  <div class="kh-logo">PIZZA <span>KHAN</span></div>
  <div class="kh-sub">НАҒЫЗ ЕТ · НАҒЫЗ ХАН</div>
  <div class="kh-pills">
    <span class="kh-pill">Самовывоз и зал</span>
    <span class="kh-pill">Наличные или Kaspi</span>
  </div>
</header>

<!-- Category grid -->
<div id="home">
  <div class="grid">
    <div class="card" onclick="openCat(22415295)">
      <img src="https://d2j6dbq0eux0bg.cloudfront.net/images/7841010/3034059084.jpg" alt="Пицца" loading="lazy">
      <div class="card-ov"></div><div class="card-lbl">ПИЦЦА</div>
    </div>
    <div class="card" onclick="openCat(22415296)">
      <img src="https://d2j6dbq0eux0bg.cloudfront.net/images/7841010/1237580693.jpg" alt="Закуски" loading="lazy">
      <div class="card-ov"></div><div class="card-lbl">ЗАКУСКИ</div>
    </div>
    <div class="card" onclick="openCat(22989347)">
      <img src="https://d2j6dbq0eux0bg.cloudfront.net/images/7841010/1237580449.jpg" alt="Бургер" loading="lazy">
      <div class="card-ov"></div><div class="card-lbl">БУРГЕР</div>
    </div>
    <div class="card" onclick="openCat(22989351)">
      <img src="https://d2j6dbq0eux0bg.cloudfront.net/images/7841010/1237581592.jpg" alt="Комбо" loading="lazy">
      <div class="card-ov"></div><div class="card-lbl">КОМБО НАБОРЫ</div>
    </div>
    <div class="card" onclick="openCat(39253334)">
      <img src="https://d2j6dbq0eux0bg.cloudfront.net/images/7841010/1172167275.jpg" alt="Донер" loading="lazy">
      <div class="card-ov"></div><div class="card-lbl">ДОНЕР</div>
    </div>
    <div class="card" onclick="openCat(105581001)">
      <img src="https://d2j6dbq0eux0bg.cloudfront.net/images/7841010/2241145074.jpg" alt="Курица" loading="lazy">
      <div class="card-ov"></div><div class="card-lbl">КУРИЦА</div>
    </div>
    <div class="card" onclick="openCat(22989354)" style="grid-column:1/-1;aspect-ratio:3/1;">
      <img src="https://d2j6dbq0eux0bg.cloudfront.net/images/7841010/1237579959.jpg" alt="Напитки" loading="lazy">
      <div class="card-ov"></div><div class="card-lbl">НАПИТКИ</div>
    </div>
  </div>
</div>

<!-- Ecwid (hidden initially) -->
<div id="store">
  <div id="my-store-7841010"></div>
</div>

<script src="https://app.ecwid.com/script.js?7841010&data_platform=code&data_date=2026-09-19" charset="utf-8"></script>
<script>
var KASPI = "https://pay.kaspi.kz/pay/wg3sxkye";
var storeInited = false;
var pendingCat = null;

function showHome() {
  document.getElementById('home').style.display = 'block';
  document.getElementById('store').style.display = 'none';
  window.scrollTo(0,0);
}

function showStore() {
  document.getElementById('home').style.display = 'none';
  document.getElementById('store').style.display = 'block';
  window.scrollTo(0,0);
}

function openCat(catId) {
  showStore();
  if (storeInited) {
    Ecwid.openPage('category', {id: catId});
  } else {
    pendingCat = catId;
    initStore();
  }
}

function initStore() {
  if (storeInited) return;
  storeInited = true;
  xProductBrowser(
    "categoriesPerRow=2",
    "views=grid(20,3) list(60) table(60)",
    "categoryView=grid",
    "searchView=list",
    "id=my-store-7841010"
  );
}

// Init store when Ecwid API is ready
window.Ecwid = window.Ecwid || [];
Ecwid.OnAPILoaded.add(function() {
  // When store is already inited and pending cat exists
  Ecwid.OnPageLoaded.add(function(page) {
    if (pendingCat && storeInited) {
      var cat = pendingCat;
      pendingCat = null;
      Ecwid.openPage('category', {id: cat});
    }
    // Auto-show store when Ecwid navigates to cart/checkout
    var storePages = ['CART','CHECKOUT_ADDRESS','CHECKOUT_DELIVERY','CHECKOUT_PAYMENT','ORDER_CONFIRMATION','PRODUCT','CATEGORY'];
    if (storePages.indexOf(page.type) !== -1) {
      showStore();
    }
    // Hide email and simplify checkout
    setTimeout(cleanupCheckout, 200);
    setTimeout(cleanupCheckout, 800);
  });

  Ecwid.OnOrderPlaced.add(function(order) {
    var total = (order && (order.total || order.subtotal)) || '';
    var no = (order && (order.orderNumber || order.vendorOrderNumber)) || '';
    var pm = (order && order.paymentMethod) || '';
    if (/kaspi/i.test(pm)) {
      document.getElementById('payAmt').textContent = total ? total + ' ₸' : '';
      document.getElementById('payNo').textContent = no ? 'ЗАКАЗ №' + no : '';
      document.getElementById('payLink').href = KASPI;
      document.getElementById('payQr').src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=4&data=' + encodeURIComponent(KASPI);
      document.getElementById('payKaspi').style.display = 'block';
      document.getElementById('payCash').style.display = 'none';
    } else {
      document.getElementById('payCashNo').textContent = no ? 'ЗАКАЗ №' + no : '';
      document.getElementById('payCashAmt').textContent = total ? total + ' ₸' : '';
      document.getElementById('payCash').style.display = 'block';
      document.getElementById('payKaspi').style.display = 'none';
    }
    document.getElementById('pay').classList.add('on');
    window.scrollTo(0,0);
  });
});

// Checkout simplification
var emailFilled = false;
var nameFilled = false;
var phoneFilled = false;

function cleanupCheckout() {
  // 1. Email — fill and auto-click submit
  var emailInput = document.getElementById('ec-cart-email-input');
  if (emailInput && !emailFilled) {
    var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
    setter.call(emailInput, 'guest@pizzakhan.local');
    emailInput.dispatchEvent(new Event('input', {bubbles: true}));
    emailInput.dispatchEvent(new Event('change', {bubbles: true}));
    emailFilled = true;
    setTimeout(function() {
      var btn = document.querySelector('.ec-cart-step--email button.form-control__button, .ec-cart__checkout button.form-control__button');
      if (btn) btn.click();
    }, 300);
  }
  // Hide done email row
  document.querySelectorAll('.ec-cart-step--email.ec-cart-step--done').forEach(function(el) {
    el.style.display = 'none';
  });

  // 2. Auto-select "Самовывоз" and hide the tile
  document.querySelectorAll('.ec-tabs__tab').forEach(function(tab) {
    var txt = tab.textContent.trim();
    if (txt === 'Самовывоз' && !tab.classList.contains('ec-tabs__tab--active')) {
      tab.click();
    }
    // Hide both delivery tabs completely
    if (txt === 'Доставка по адресу' || txt === 'Самовывоз') {
      tab.style.display = 'none';
    }
  });
  // Hide the whole tabs block (the tile row)
  document.querySelectorAll('.ec-tabs, .ec-tabs__wrap').forEach(function(el) {
    el.style.display = 'none';
  });
  // Hide "Выберите, как хотите получить заказ" label
  document.querySelectorAll('.ec-cart-step__section').forEach(function(el) {
    if (el.textContent.includes('Выберите, как хотите получить заказ')) {
      el.style.display = 'none';
    }
  });

  // 3. Name — fill and hide
  var nameInput = document.getElementById('ec-full-name');
  if (nameInput && !nameFilled) {
    var setter2 = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
    setter2.call(nameInput, 'Гость QR-меню');
    nameInput.dispatchEvent(new Event('input', {bubbles: true}));
    nameInput.dispatchEvent(new Event('change', {bubbles: true}));
    nameFilled = true;
  }
  // Hide name row always
  var nameInput2 = document.getElementById('ec-full-name');
  if (nameInput2) {
    var nameRow = nameInput2.closest('.ec-form__row');
    if (nameRow) nameRow.style.display = 'none';
  }

  // 4. Phone — fill and hide
  var phoneInput = document.getElementById('ec-phone');
  if (phoneInput && !phoneFilled) {
    var setter3 = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
    setter3.call(phoneInput, '+70000000000');
    phoneInput.dispatchEvent(new Event('input', {bubbles: true}));
    phoneInput.dispatchEvent(new Event('change', {bubbles: true}));
    phoneFilled = true;
  }
  // Hide phone row always
  var phoneInput2 = document.getElementById('ec-phone');
  if (phoneInput2) {
    var phoneRow = phoneInput2.closest('.ec-form__row');
    if (phoneRow) phoneRow.style.display = 'none';
  }

  // 5. Hide clutter
  document.querySelectorAll('.ec-cart-next__header, .ec-cart-step--empty, .ec-cart-step--done, .ec-cart-step__section--description').forEach(function(el) {
    el.style.display = 'none';
  });

  // 6. Rename button
  document.querySelectorAll('.form-control__button-text').forEach(function(s) {
    if (s.textContent.trim() === 'Разместить заказ') s.textContent = 'Готовить!';
  });
}

// MutationObserver as backup
new MutationObserver(cleanupCheckout).observe(document.body, {childList: true, subtree: true});

// Handle Ecwid cart button click — init store if needed
document.addEventListener('click', function(e) {
  var cartBtn = e.target.closest('.ec-cart-widget, [class*="cart"]');
  if (cartBtn && !storeInited) {
    initStore();
    setTimeout(function() { showStore(); }, 500);
  }
});
</script>
</body>
</html>
